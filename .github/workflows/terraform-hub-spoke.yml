name: Terraform Hub-Spoke Network

on:
  workflow_dispatch:
    inputs:

      # ---------------------------------------------------------
      # Terraform Action
      # ---------------------------------------------------------
      action:
        description: "Select Terraform action"
        required: true
        type: choice
        options:
          - apply
          - destroy
        default: apply

      # ---------------------------------------------------------
      # Environment
      # ---------------------------------------------------------
      environment:
        description: "Select environment"
        required: true
        type: choice
        options:
          - dev
        default: dev


permissions:
  id-token: write
  contents: write


concurrency:
  group: terraform-hub-spoke-${{ inputs.environment }}
  cancel-in-progress: false


jobs:

  terraform:

    name: Terraform ${{ inputs.action }} - ${{ inputs.environment }}

    runs-on: ubuntu-latest

    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    defaults:
      run:
        working-directory: terraform


    steps:

      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ---------------------------------------------------------
      # 2. Display selected parameters
      # ---------------------------------------------------------
      - name: Display Deployment Parameters
        run: |
          echo "=========================================="
          echo "Terraform Deployment"
          echo "=========================================="
          echo "Action      : ${{ inputs.action }}"
          echo "Environment : ${{ inputs.environment }}"
          echo "=========================================="


      # ---------------------------------------------------------
      # 3. Authenticate to Azure using GitHub OIDC
      # ---------------------------------------------------------
      - name: Azure Login using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # ---------------------------------------------------------
      # 4. Verify Azure authentication and RBAC
      # ---------------------------------------------------------
      - name: Verify Azure access
        run: |
          echo "===== Azure Account ====="
          az account show

          echo "===== rg-network ====="
          az group show --name rg-network

          echo "===== rg-app-dev ====="
          az group show --name rg-app-dev


      # ---------------------------------------------------------
      # 5. Install Terraform
      # ---------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # ---------------------------------------------------------
      # 6. Initialize Terraform
      # ---------------------------------------------------------
      - name: Terraform Init
        run: terraform init


      # ---------------------------------------------------------
      # 7. Check Terraform formatting
      # ---------------------------------------------------------
      - name: Terraform Format Check
        run: terraform fmt -check -recursive


      # ---------------------------------------------------------
      # 8. Validate Terraform
      # ---------------------------------------------------------
      - name: Terraform Validate
        run: terraform validate


      # ---------------------------------------------------------
      # 9. Generate Terraform Plan
      # ---------------------------------------------------------
      - name: Terraform Plan
        run: |
          if [ "${{ inputs.action }}" = "destroy" ]; then

            echo "Generating Terraform DESTROY plan..."

            terraform plan \
              -destroy \
              -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
              -var-file="environments/${{ inputs.environment }}.tfvars" \
              -out=tfplan

          else

            echo "Generating Terraform APPLY plan..."

            terraform plan \
              -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
              -var-file="environments/${{ inputs.environment }}.tfvars" \
              -out=tfplan

          fi


      # ---------------------------------------------------------
      # 10. Apply Terraform
      # ---------------------------------------------------------
      - name: Terraform Apply
        if: inputs.action == 'apply'
        run: |
          echo "Applying Terraform plan..."

          terraform apply \
            -auto-approve \
            tfplan


      # ---------------------------------------------------------
      # 11. Destroy Terraform
      # ---------------------------------------------------------
      - name: Terraform Destroy
        if: inputs.action == 'destroy'
        run: |
          echo "Destroying Terraform-managed infrastructure..."

          terraform apply \
            -auto-approve \
            tfplan


      # ---------------------------------------------------------
      # 12. Display Terraform outputs
      # ---------------------------------------------------------
      - name: Terraform Outputs
        if: inputs.action == 'apply'
        run: |
          terraform output


      # ---------------------------------------------------------
      # 13. Commit Terraform state to GitHub
      # ---------------------------------------------------------
      - name: Commit Terraform State
        if: inputs.action == 'apply' || inputs.action == 'destroy'
        working-directory: .
        shell: bash
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add terraform/terraform.tfstate

          if [ -f terraform/terraform.tfstate.backup ]; then
            git add terraform/terraform.tfstate.backup
          fi

          if ! git diff --cached --quiet; then

            git commit \
              -m "chore: terraform ${{ inputs.action }} ${{ inputs.environment }} [skip ci]"

            git push

          else

            echo "No Terraform state changes to commit."

          fi
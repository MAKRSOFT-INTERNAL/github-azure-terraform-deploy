name: Terraform Hub-Spoke Network

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

concurrency:
  group: terraform-hub-spoke-network
  cancel-in-progress: false

jobs:
  terraform:
    name: Deploy Azure Hub-Spoke Network
    runs-on: ubuntu-latest

    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure access
        run: |
          az account show
          az group show --name rg-network
          az group show --name rg-app-dev

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan \
            -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            -var-file="environments/dev.tfvars" \
            -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Terraform Outputs
        run: terraform output

      - name: Commit Terraform State
        working-directory: .
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add terraform/terraform.tfstate

          if [ -f terraform/terraform.tfstate.backup ]; then
            git add terraform/terraform.tfstate.backup
          fi

          if ! git diff --cached --quiet; then
            git commit -m "chore: update terraform state [skip ci]"
            git push
          else
            echo "No Terraform state changes to commit."
          fi
